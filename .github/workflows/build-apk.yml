name: Build e publicar APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/update_runoff.py'
      - 'tests/test_runoff.py'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão do aplicativo
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo 'Não foi possível identificar versionName.' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar a base e o funcionamento do segundo turno
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_runoff.py' -v
          cp data/runoff-dashboard.json app/src/main/assets/runoff-2026.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK release sem chave efêmera
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebugAndroidTest

      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar abertura offline, navegação e atualização no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p app/build/reports/screenshots
            adb pull /sdcard/Android/data/br.com.eleicoes.termometro/files/qa app/build/reports/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-android-${{ steps.meta.outputs.version }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

      - name: Assinar com identidade de desenvolvimento estável
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p signing dist

          # Mesma identidade de TESTE do AOSP adotada na v0.2.0.
          # É estável para atualização dos APKs de desenvolvimento, mas não é
          # uma chave de produção nem deve ser usada como assinatura Play Store.
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/tags/android-11.0.0_r29/target/product/security/testkey.pk8?format=TEXT' | base64 --decode > signing/testkey.pk8
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/tags/android-11.0.0_r29/target/product/security/testkey.x509.pem?format=TEXT' | base64 --decode > signing/testkey.x509.pem

          APK_INPUT="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_INPUT" ]; then
            echo 'APK release não encontrado.' >&2
            exit 1
          fi

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK_INPUT" "dist/Termometro-Eleicoes-2026-v${VERSION}-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --key signing/testkey.pk8 \
            --cert signing/testkey.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "dist/Termometro-Eleicoes-2026-v${VERSION}.apk" \
            "dist/Termometro-Eleicoes-2026-v${VERSION}-aligned.apk"
          rm "dist/Termometro-Eleicoes-2026-v${VERSION}-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "dist/Termometro-Eleicoes-2026-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Termometro-Eleicoes-2026-v${{ steps.meta.outputs.version }}
          path: dist/Termometro-Eleicoes-2026-v${{ steps.meta.outputs.version }}.apk

      - name: Publicar Release ou fallback no repositório
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          NOTES='v0.11.0 reconstrói o funcionamento do segundo turno. Primeira abertura com dados incluídos no APK, leitura salva e proteção contra respostas inválidas; atualização por conteúdo com aviso quando não há pesquisa nova. Retorna o diagnóstico com apoio agregado, probabilidade exploratória de vitória, incerteza e auditoria dos pesos. Histórico anterior à instalação por datas de divulgação, busca e filtros, fontes e mercado de previsão separados. Pipeline exclusivo do segundo turno independente do primeiro turno. Validado com testes de dados e testes Android em emulador. Assinatura estável desde v0.2.0.'
          APK="dist/Termometro-Eleicoes-2026-v${VERSION}.apk"
          TAG="v${VERSION}"
          RELEASE_OK=0

          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release upload "$TAG" "$APK" --clobber && gh release edit "$TAG" --notes "$NOTES"; then
              RELEASE_OK=1
            fi
          else
            if gh release create "$TAG" "$APK" --target "${GITHUB_SHA}" --title "Termômetro Eleições 2026 ${TAG}" --notes "$NOTES"; then
              RELEASE_OK=1
            fi
          fi

          if [ "$RELEASE_OK" -eq 1 ]; then
            echo "Release publicada com sucesso."
            exit 0
          fi

          echo "::warning::API de Releases indisponível para o token do Actions; usando fallback persistente no repositório."
          cp "$APK" "/tmp/Termometro-Eleicoes-2026-v${VERSION}.apk"
          git config user.name "build-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p downloads
            cp "/tmp/Termometro-Eleicoes-2026-v${VERSION}.apk" "downloads/Termometro-Eleicoes-2026-v${VERSION}.apk"
            git add "downloads/Termometro-Eleicoes-2026-v${VERSION}.apk"

            if git diff --cached --quiet; then
              echo "APK já está publicado em downloads/."
              exit 0
            fi

            git commit -m "build: publica APK v${VERSION}"
            if git push origin HEAD:main; then
              echo "APK publicado em downloads/."
              exit 0
            fi
            sleep 2
          done

          echo "Falha ao publicar tanto na Release quanto no fallback." >&2
          exit 1
