name: Build e publicar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão do aplicativo
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo 'Não foi possível identificar versionName.' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK release sem chave efêmera
        run: gradle --no-daemon :app:assembleRelease

      - name: Assinar com identidade de desenvolvimento estável
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p signing dist

          # Mesma identidade de TESTE do AOSP adotada na v0.2.0.
          # É estável para atualização dos APKs de desenvolvimento, mas não é
          # uma chave de produção nem deve ser usada como assinatura Play Store.
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/tags/android-11.0.0_r29/target/product/security/testkey.pk8?format=TEXT' | base64 --decode > signing/testkey.pk8
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/tags/android-11.0.0_r29/target/product/security/testkey.x509.pem?format=TEXT' | base64 --decode > signing/testkey.x509.pem

          APK_INPUT="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_INPUT" ]; then
            echo 'APK release não encontrado.' >&2
            exit 1
          fi

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK_INPUT" "dist/Termometro-Eleicoes-2026-v${VERSION}-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --key signing/testkey.pk8 \
            --cert signing/testkey.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "dist/Termometro-Eleicoes-2026-v${VERSION}.apk" \
            "dist/Termometro-Eleicoes-2026-v${VERSION}-aligned.apk"
          rm "dist/Termometro-Eleicoes-2026-v${VERSION}-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "dist/Termometro-Eleicoes-2026-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Termometro-Eleicoes-2026-v${{ steps.meta.outputs.version }}
          path: dist/Termometro-Eleicoes-2026-v${{ steps.meta.outputs.version }}.apk

      - name: Publicar/atualizar Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          NOTES='v0.3.0 amplia o aplicativo com agregação de pesquisas individuais, deduplicação por registro, ponderação por recência e amostra, intervalos de incerteza, histórico de até 90 dias, tendência observada em 5/15/30/60/90 dias, cenários de segundo turno separados, painel de qualidade e mercado de previsão exibido apenas como sinal externo. Mantém a mesma assinatura estável da v0.2.0.'
          APK="dist/Termometro-Eleicoes-2026-v${VERSION}.apk"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "${GITHUB_SHA}" --title "Termômetro Eleições 2026 ${TAG}" --notes "$NOTES"
          fi
