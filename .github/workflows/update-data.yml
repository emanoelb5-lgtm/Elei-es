name: Atualizar dados eleitorais

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_analytics.py'
      - 'requirements.txt'
      - 'tests/test_analytics.py'

permissions:
  contents: write

concurrency:
  group: dados-eleitorais-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Testar parser e agregador corrente
        run: python -m unittest discover -s tests -p 'test_analytics.py' -v

      - name: Atualizar analytics auditáveis
        run: python scripts/update_analytics.py

      - name: Validar saída corrente
        run: |
          python - <<'PY'
          import json

          a=json.load(open('data/analytics.json'))
          h=json.load(open('data/analytics-history.json'))
          p=json.load(open('data/polls.json'))
          c=json.load(open('data/calibration.json'))
          r=json.load(open('data/regime-history.json'))

          assert a.get('schemaVersion') == 11
          assert c.get('schemaVersion') == 1
          assert c.get('correctionApplied') is False
          assert len(a.get('candidates', [])) >= 2
          assert a['quality']['pollCount'] >= 1
          assert a['quality']['instituteCount'] >= 1
          assert a['quality']['methodCount'] >= 1
          assert a['quality']['registrationCount'] >= 1
          assert len(h) >= 2
          assert len(p.get('firstRound', [])) >= 1
          assert c['sourceDiagnostics']['comparisonCount'] >= 1
          assert c['rollingValidation']['status'] in ('ok', 'insufficient-data')
          assert a['responseComposition']['available'] in (True, False)
          assert a['sensitivity']['status'] in ('ok', 'insufficient-data')
          assert a['influence']['status'] in ('ok', 'insufficient-data')
          assert a['temporalCoverage']['status'] in ('ok', 'insufficient-data')
          if a['temporalCoverage']['status'] == 'ok':
              assert a['temporalCoverage']['latestAgeDays'] >= 0
              assert 0 <= a['temporalCoverage']['recent7WeightShare'] <= 1
              assert 0 <= a['temporalCoverage']['recent14WeightShare'] <= 1
              assert a['temporalCoverage']['freshness'] in ('fresca', 'moderada', 'defasada')
          assert a['influence'].get('correctionApplied', False) is False
          assert a['uncertainty']['status'] in ('ok', 'insufficient-data')
          assert a['regimeShift']['status'] in ('ok', 'insufficient-data')
          assert a['regimeShift'].get('adaptiveApplied', False) is False
          assert a['regimeShift'].get('persistenceApplied', False) is False
          assert isinstance(r, list) and len(r) >= 1
          assert r[-1]['evidenceFingerprint'] == a['regimeShift']['evidenceFingerprint']
          assert c['regimeShadowValidation']['status'] in ('ok', 'insufficient-data')
          assert c['regimeShadowValidation'].get('adaptiveApplied', False) is False
          if a['uncertainty']['status'] == 'ok':
              assert a['uncertainty']['bootstrapDraws'] >= 100
              assert a['uncertainty']['instituteBootstrapDraws'] >= 100
              assert a['uncertainty']['instituteClusterCount'] >= 3
              assert a['uncertainty']['methodBootstrapDraws'] >= 100
              assert a['uncertainty']['methodClusterCount'] >= 2
              assert a['uncertainty']['methodDiversity']['status'] == 'ok'
              assert a['uncertainty']['empiricalErrorQuantileUsed'] == 'q80'
              assert len(a['uncertainty']['candidates']) >= 2
          if a['influence']['status'] == 'ok':
              assert a['influence']['pollCount'] >= 3
              assert a['influence']['instituteCount'] >= 1
              assert isinstance(a['influence']['polls'], list)
              assert isinstance(a['influence']['institutes'], list)
          if a['sensitivity']['status'] == 'ok':
              assert a['sensitivity']['maxLeaveOneOutShift'] >= 0
              assert a['sensitivity']['stability'] in ('alta', 'moderada', 'baixa')

          for candidate in a['candidates']:
              assert 0 <= candidate['pollingSupport'] <= 100
              assert 0 <= candidate['intervalLow'] <= candidate['pollingSupport'] <= candidate['intervalHigh'] <= 100

          print(
              'Validação corrente OK:',
              a['quality'],
              'histórico=', len(h),
              'pesquisas=', len(p['firstRound'])
          )
          PY

      - name: Publicar dados correntes se houver mudança
        run: |
          set -euo pipefail
          git config user.name "eleicoes-bot"
          git config user.email "actions@users.noreply.github.com"

          cp data/analytics.json /tmp/analytics.json
          cp data/analytics-history.json /tmp/analytics-history.json
          cp data/polls.json /tmp/polls.json
          cp data/calibration.json /tmp/calibration.json
          cp data/regime-history.json /tmp/regime-history.json

          for attempt in 1 2 3 4 5; do
            echo "Tentativa de publicação $attempt/5"
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/analytics.json data/analytics.json
            cp /tmp/analytics-history.json data/analytics-history.json
            cp /tmp/polls.json data/polls.json
            cp /tmp/calibration.json data/calibration.json
            cp /tmp/regime-history.json data/regime-history.json

            git add data/analytics.json data/analytics-history.json data/polls.json data/calibration.json data/regime-history.json
            if git diff --cached --quiet; then
              echo "Sem mudança"
              exit 0
            fi

            git commit -m "data: atualiza analytics e diagnosticos correntes"
            if git push origin HEAD:main; then
              echo "Publicação concluída"
              exit 0
            fi

            echo "main avançou durante a publicação; reaplicando JSONs sobre o HEAD mais recente"
            sleep 2
          done

          echo "Não foi possível publicar após 5 tentativas." >&2
          exit 1
