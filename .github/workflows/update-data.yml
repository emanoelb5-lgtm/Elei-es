name: Atualizar dados eleitorais
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_runoff.py'
      - 'scripts/update_analytics.py'
      - 'data/runoff-curated.json'
      - 'tests/test_runoff.py'
      - '.github/workflows/update-data.yml'
permissions:
  contents: write
concurrency:
  group: dados-eleitorais-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Testar o funcionamento do segundo turno
        run: python -m unittest discover -s tests -p 'test_runoff.py' -v
      - name: Coletar e publicar a leitura do segundo turno
        run: |
          set -euo pipefail
          git config user.name "eleicoes-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -m scripts.update_runoff
            python - <<'PY'
          import json
          from zoneinfo import ZoneInfo
          from datetime import datetime
          from scripts.update_runoff import validate_poll
          r = json.load(open('data/runoff-dashboard.json'))
          assert r['schemaVersion'] == 2
          assert r['pollCount'] == len(r['polls'])
          today = datetime.now(ZoneInfo('America/Sao_Paulo')).date()
          for row in r['polls']:
              validate_poll(row, today)
          assert len({p['id'] for p in r['polls']}) == len(r['polls'])
          assert r['model']['status'] in ('ok', 'insufficient-data')
          if r['model']['status'] == 'ok':
              assert not r['model']['calibrated']
              assert abs(sum(r['model']['winProbability'].values()) - 100) < .1
          assert json.load(open('data/runoff-2026.json'))['schemaVersion'] == 1
          print('Segundo turno validado:', r['pollCount'], 'pesquisas')
          PY
            git add data/runoff-dashboard.json data/runoff-2026.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: sincroniza pesquisas e diagnostico do segundo turno"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Falha ao publicar após três tentativas.' >&2
          exit 1
