name: Atualizar dados eleitorais

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: dados-eleitorais-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Testar parser e agregador
        run: python -m unittest discover -s tests -v

      - name: Atualizar analytics auditáveis
        run: python scripts/update_analytics.py

      - name: Executar backtest histórico separado
        run: python scripts/historical_backtest.py

      - name: Validar saída v4
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          a=json.load(open('data/analytics.json'))
          h=json.load(open('data/analytics-history.json'))
          p=json.load(open('data/polls.json'))
          c=json.load(open('data/calibration.json'))
          b=json.load(open('data/historical-backtest.json'))

          assert a.get('schemaVersion') == 3
          assert c.get('schemaVersion') == 1
          assert c.get('correctionApplied') is False
          assert b.get('schemaVersion') == 1
          assert len(b.get('studies', [])) >= 1
          assert b['studies'][0]['correctionApplied'] is False
          assert len(a.get('candidates', [])) >= 2
          assert a['quality']['pollCount'] >= 1
          assert a['quality']['instituteCount'] >= 1
          assert a['quality']['methodCount'] >= 1
          assert a['quality']['registrationCount'] >= 1
          assert len(h) >= 2
          assert len(p.get('firstRound', [])) >= 1
          assert c['sourceDiagnostics']['comparisonCount'] >= 1
          assert c['rollingValidation']['status'] in ('ok', 'insufficient-data')

          for c in a['candidates']:
              assert 0 <= c['pollingSupport'] <= 100
              assert 0 <= c['intervalLow'] <= c['pollingSupport'] <= c['intervalHigh'] <= 100

          print(
              'Validação v4 OK:',
              a['quality'],
              'histórico=', len(h),
              'pesquisas=', len(p['firstRound'])
          )
          PY

      - name: Publicar dados se houver mudança
        run: |
          set -euo pipefail
          git config user.name "eleicoes-bot"
          git config user.email "actions@users.noreply.github.com"

          cp data/analytics.json /tmp/analytics.json
          cp data/analytics-history.json /tmp/analytics-history.json
          cp data/polls.json /tmp/polls.json
          cp data/calibration.json /tmp/calibration.json
          cp data/historical-backtest.json /tmp/historical-backtest.json

          for attempt in 1 2 3 4 5; do
            echo "Tentativa de publicação $attempt/5"
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/analytics.json data/analytics.json
            cp /tmp/analytics-history.json data/analytics-history.json
            cp /tmp/polls.json data/polls.json
            cp /tmp/calibration.json data/calibration.json
            cp /tmp/historical-backtest.json data/historical-backtest.json

            git add data/analytics.json data/analytics-history.json data/polls.json data/calibration.json data/historical-backtest.json
            if git diff --cached --quiet; then
              echo "Sem mudança"
              exit 0
            fi

            git commit -m "data: atualiza analytics e diagnosticos v4"
            if git push origin HEAD:main; then
              echo "Publicação concluída"
              exit 0
            fi

            echo "main avançou durante a publicação; reaplicando JSONs sobre o HEAD mais recente"
            sleep 2
          done

          echo "Não foi possível publicar após 5 tentativas." >&2
          exit 1
