name: Atualizar dados eleitorais

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tools/**'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tools/update_data_safe.py
      - name: Validar saída
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/latest.json'))
          vals={c['id']:c['pollingSupport'] for c in d['candidates']}
          assert 20 <= vals.get('lula',0) <= 60
          assert 20 <= vals.get('flavio-bolsonaro',0) <= 60
          for k,v in vals.items():
              if k not in ('lula','flavio-bolsonaro'):
                  assert 0 <= v <= 15, (k,v)
          print('Validação OK', vals)
          PY
      - name: Publicar nova leitura se houver mudança
        run: |
          git config user.name "eleicoes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history.json
          if git diff --cached --quiet; then
            echo "Sem mudança"
          else
            git commit -m "data: atualiza leitura eleitoral validada"
            git push
          fi
